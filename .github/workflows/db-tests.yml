
name: Database tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meditech

    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start database and apply migrations
        run: supabase db start

      - name: Load demo data
        run: supabase db reset

      - name: Run pgTAP tests
        run: supabase test db

  flutter-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meditech

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable

      - name: Get packages
        run: flutter pub get

      - name: Check code for problems
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test
