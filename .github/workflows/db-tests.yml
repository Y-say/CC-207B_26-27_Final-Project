name: Database tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  db-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meditech
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Start database and apply migrations
        run: supabase db start

      - name: Run pgTAP tests
        run: supabase test db